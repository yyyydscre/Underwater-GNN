# YOLO11 P2 precision branch with dynamic cross-scale fusion and coordinate attention.
nc: 80
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, true]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, true]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # Preserve the pretrained YOLO11 P3/P4/P5 pathway.
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]] # 13-P4/16
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, false]] # 16-P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]] # 19-P4/16
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]] # 22-P5/32

  # P2 semantic/detail fusion. Both custom layers can be disabled for ablation.
  - [16, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]] # 24
  - [-1, 1, UnderwaterCrossScaleGate, [256, 8, true]] # 25
  - [-1, 2, C3k2, [128, false]] # 26-P2/4
  - [-1, 1, ResidualCoordinateAttention, [64, 16, true]] # 27
  - [[27, 16, 19, 22], 1, Detect, [nc]]
